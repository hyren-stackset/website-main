<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Stackset</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body class="min-h-screen">
  <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-6">
    <div class="bg-grid absolute inset-0" aria-hidden="true"></div>
    <div class="pointer-events-none absolute inset-0" aria-hidden="true">
      <div class="animate-drift-slow absolute -top-24 left-[15%] h-96 w-96 rounded-full bg-violet/20 blur-[120px]"></div>
      <div class="animate-drift-slower absolute right-[10%] bottom-0 h-80 w-80 rounded-full bg-cyan/15 blur-[110px]"></div>
    </div>
    <div class="glass relative max-w-md rounded-3xl p-10 text-center">
      <p class="font-mono text-xs tracking-[0.25em] text-cyan">ERROR 404</p>
      <h1 class="font-display mt-4 text-4xl font-bold tracking-tight text-bright">Stack <span class="text-gradient">not found.</span></h1>
      <p class="mt-4 text-body">This environment was torn down, drifted away, or never existed. Let's roll you back to safety.</p>
      <a href="/" class="btn-primary mt-8">Back to stackset.io</a>
    </div>
  </main>
</body>
</html>
